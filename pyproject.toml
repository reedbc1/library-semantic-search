[project]
name = "library-semantic-search"
version = "0.1.0"
description = "Semantic search over a locally synchronized library catalog"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Flask==3.1.3",
    "gunicorn==25.3.0",
    "httpx==0.28.1",
    "openai==2.30.0",
    "python-dotenv==1.2.2",
    "sqliteai-vector==0.9.93",
    "tqdm==4.67.3",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.4",
]

[tool.setuptools.packages.find]
include = ["library_search*"]

[tool.setuptools.package-data]
"library_search.web" = ["templates/*.html", "static/*.css"]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
